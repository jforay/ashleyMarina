<!-- templates/registration/login.html -->
{% extends "base.html" %}
{% block content %}
<div class="container-fluid p-0">
    <div style="background-color: #0078A0; padding: 2rem;">
        <h2 class="marina-name text-center">Login</h2>
    </div>
</div>

<br><br>
<div class="justify-content-center text-center">
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-marina">Log In</button>
  </form>
  <br>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{% url 'password_reset' %}" class="btn btn-marina">Forgot your password?</a>
    <!-- <a href="{% url 'owners_signup' %}" class="btn btn-marina">Create Account</a> -->
  </div>
  
</div>

{% endblock %}
